# Console UART qua MCU-LINK; giữ printk cho boot/diagnostics của hệ thống.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Native Zephyr Logging: tạo message tại caller, xử lý UART ở logger thread.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
CONFIG_LOG_PRINTK=y

# Level mặc định và level riêng của application: ERR + WRN + INF.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
CONFIG_MCXN_APP_LOG_LEVEL_INF=y
CONFIG_MCXN_LOG_SOURCE_LOCATION=y

# Prefix do printLog_* thêm; tránh lặp tên hàm từ logger native.
CONFIG_LOG_FUNC_NAME_PREFIX_ERR=n
CONFIG_LOG_FUNC_NAME_PREFIX_WRN=n
CONFIG_LOG_FUNC_NAME_PREFIX_INF=n
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n
CONFIG_LOG_BACKEND_SHOW_TIMESTAMP=y
CONFIG_LOG_BACKEND_SHOW_LEVEL=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
